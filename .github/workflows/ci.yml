name: CI
# Manual only: routine verification happens locally. Run this from the Actions tab
# or with `gh workflow run CI` when a Linux or macOS runner check is wanted.
on: workflow_dispatch

jobs:
  verify:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Enforce binary size
        shell: sh
        run: |
          bytes=$(wc -c < target/release/ma)
          echo "release binary: $bytes bytes"
          test "$bytes" -lt 10000000
