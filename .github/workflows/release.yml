name: Release

# Publishing is a deliberate act: pushing a vX.Y.Z tag builds the binaries and
# publishes them. The verify job gates the build, so a failing test suite or a
# tag that disagrees with Cargo.toml aborts before anything is attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --release
      - name: Tag must match Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" ||
            { echo "tag $GITHUB_REF_NAME does not match Cargo.toml $version" >&2; exit 1; }

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: sh
        run: |
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="ma-$version-${{ matrix.target }}"
          mkdir -p "dist/$name"
          # Both README halves and both security policies ship, so a tarball carries
          # documentation in either language rather than only the repository default.
          cp "target/${{ matrix.target }}/release/ma" LICENSE "dist/$name/"
          cp README.md README.zh.md SECURITY.md SECURITY.en.md "dist/$name/"
          chmod +x "dist/$name/ma"
          (cd "dist" && tar -czf "$name.tar.gz" "$name")
          rm -rf "dist/$name"
          echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"
      - name: Binary size
        shell: sh
        run: |
          bytes=$(wc -c < "target/${{ matrix.target }}/release/ma")
          echo "${{ matrix.target }}: $bytes bytes"
          test "$bytes" -lt 10000000
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.tar.gz
