[package]
name = "oneagent"
version = "0.3.8"
edition = "2024"
rust-version = "1.85"
description = "One-shot AI agent CLI in Rust: a single binary that drives your shell, pipes diffs and logs into any OpenAI-compatible model, and exits."
license = "MIT"
repository = "https://github.com/lihuu/oneagent"
readme = "README.md"
keywords = ["agent", "llm", "cli", "openai", "shell"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ma"
path = "src/main.rs"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
serde_json = "1"
tar = { version = "0.4", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
